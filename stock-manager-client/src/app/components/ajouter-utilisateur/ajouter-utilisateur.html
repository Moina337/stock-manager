<div class="min-h-[80vh] flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden">
    
    <!-- En-tête -->
    <div class="bg-blue-600 p-6">
      <h2 class="text-2xl font-bold text-white flex items-center gap-2">
        <i class="fa fa-user-plus"></i> Nouveau compte
      </h2>
    
    </div>

    <!-- Formulaire -->
    <form (ngSubmit)="ajouterUtilisateur()" class="p-8 space-y-5">
      
      <!-- Champ Nom -->
      <div class="space-y-1">
        <label for="nom" class="text-sm font-semibold text-gray-600 ml-1">Nom complet</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
            <i class="fas fa-user"></i>
          </span>
          <input type="text" id="nom" [(ngModel)]="utilisateur.nom" name="nom" required 
            class="w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all outline-none text-gray-700"
            placeholder="Ex: Jean Dupont">
        </div>
      </div>

      <!-- Champ Email -->
      <div class="space-y-1">
        <label for="email" class="text-sm font-semibold text-gray-600 ml-1">Adresse Email</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
            <i class="fas fa-envelope"></i>
          </span>
          <input type="email" id="email" [(ngModel)]="utilisateur.email" name="email" required 
            class="w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all outline-none text-gray-700"
            placeholder="jean@exemple.com">
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Mot de passe -->
        <div class="space-y-1">
          <label for="password" class="text-sm font-semibold text-gray-600 ml-1">Mot de passe</label>
          <input type="password" id="password" [(ngModel)]="utilisateur.password" name="password" required 
            class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all outline-none text-gray-700"
            placeholder="••••••••">
        </div>

        <!-- Confirmation -->
        <div class="space-y-1">
          <label for="confirm" class="text-sm font-semibold text-gray-600 ml-1">Confirmation</label>
          <input type="password" id="confirm" [(ngModel)]="comfirmationMotDePasse" name="comfirmationMotDePasse" required 
            class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all outline-none text-gray-700"
            placeholder="••••••••">
        </div>
      </div>

      <!-- Actions -->
      <div class="flex flex-col gap-3 pt-4">
        <button type="submit" 
          class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg shadow-blue-200 transition-all active:scale-[0.98]">
          Créer l'utilisateur
        </button>
        
      </div>

    </form>
  </div>
</div>
