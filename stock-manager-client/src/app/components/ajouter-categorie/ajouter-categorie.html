<div class="max-w-xl mx-auto  px-4">
  <!-- En-tête -->
  <div class="mb-8 text-center">
    <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-100 text-indigo-600 rounded-2xl mb-4 shadow-sm">
      <i class="fa fa-folder-open text-2xl"></i>
    </div>
    <h2 class="text-3xl font-extrabold text-gray-900">Nouvelle catégorie</h2>
    <p class="text-gray-500 mt-2">Organisez vos produits en créant des sections claires.</p>
  </div>

  <!-- Formulaire -->
  <form (submit)="validerAjout()" 
        class="bg-white p-8 rounded-3xl shadow-xl border border-gray-100 space-y-6 transition-all hover:shadow-2xl">
    
    <div class="space-y-2">
      <label for="nom" class="text-sm font-bold text-gray-700 ml-1">Nom de la catégorie</label>
      <div class="relative">
        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-400">
          <i class="fa fa-pencil text-sm"></i>
        </span>
        <input type="text" id="nom" name="nom" [(ngModel)]="NvCategorie.nom" required
               class="block w-full pl-11 pr-4 py-3.5 bg-gray-50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all placeholder-gray-400"
               placeholder="Ex: Électronique, Mobilier...">
      </div>
    </div>

    <!-- Actions -->
    <div class="pt-4 flex flex-col sm:flex-row gap-3">
      <button type="submit" 
              [disabled]="!NvCategorie.nom.trim()"
              class="flex-1 bg-indigo-600 text-white font-bold py-4 px-6 rounded-2xl hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed shadow-lg shadow-indigo-200 transition-all active:scale-95 flex items-center justify-center gap-2">
        <i class="fa fa-check"></i>
        Créer la catégorie
      </button>
      
      <button type="button" routerLink="/categories"
              class="px-8 py-4 bg-white text-gray-500 font-bold rounded-2xl hover:bg-gray-100 transition-all border border-gray-200">
        Annuler
      </button>
    </div>
  </form>

  <!-- Astuce -->
  <div class="mt-8 p-4 bg-indigo-50 rounded-2xl border border-indigo-100 flex items-start gap-3">
    <i class="fa fa-info-circle text-indigo-400 mt-0.5"></i>
    <p class="text-xs text-indigo-700 leading-relaxed">
      <strong>Astuce :</strong> Utilisez des noms courts et explicites pour faciliter la recherche de produits par vos utilisateurs plus tard.
    </p>
  </div>
</div>
