<div class="max-w-xl mx-auto mt-16 px-4">
  <!-- En-tête -->
  <div class="mb-8 flex items-center justify-between">
    <div>
      <h2 class="text-3xl font-extrabold text-gray-900 tracking-tight">Modifier la catégorie</h2>
      <p class="text-gray-500 mt-1">ID : <span class="font-mono text-indigo-600 font-bold">#{{ idCategorie }}</span></p>
    </div>
    
  </div>

  <!-- Formulaire Carte -->
  <form (submit)="validerModif()" 
        class="bg-white p-8 rounded-3xl shadow-xl border border-gray-100 space-y-6">
    
    <div class="space-y-2">
      <label for="nom" class="text-sm font-bold text-gray-700 ml-1">Nom de la catégorie</label>
      <div class="relative">
        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-400">
          <i class="fa fa-pencil text-sm"></i>
        </span>
        <input type="text" id="nom" name="nom" [(ngModel)]="categorieUpdate.nom" required
               class="block w-full pl-11 pr-4 py-3.5 bg-indigo-50/30 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all">
      </div>
    </div>

    <!-- Actions -->
    <div class="pt-4 flex flex-col sm:flex-row gap-3">
      <button type="submit" 
              class="flex-1 bg-indigo-600 text-white font-bold py-4 px-6 rounded-2xl hover:bg-indigo-700 shadow-lg shadow-indigo-100 transition-all active:scale-95 flex items-center justify-center gap-2">
        <i class="fa fa-save"></i>
        Enregistrer les changements
      </button>
      
      <button type="button" routerLink="/categories"
              class="px-8 py-4 bg-gray-50 text-gray-500 font-bold rounded-2xl hover:bg-gray-100 transition-all border border-gray-100">
        Annuler
      </button>
    </div>
  </form>
</div>
