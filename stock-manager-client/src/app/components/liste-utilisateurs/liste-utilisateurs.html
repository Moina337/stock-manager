<div class="space-y-6">
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-4 rounded-xl shadow-sm border border-gray-100">
    <div class="relative flex-1 max-w-md">
      <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
        <i class="fa fa-search"></i>
      </span>
    <input 
  type="text" 
     [(ngModel)]="rechercheNom"
   
  placeholder="Rechercher un utilisateur..." 
  class="pl-10 block w-full py-2 px-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition">

    </div>
    
    <div class="flex items-center gap-2">
  
      <a routerLink="/ajouter-utilisateur" class="flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition shadow-md shadow-blue-200">
        <i class="fa fa-plus"></i>
        <span>Ajouter</span>
      </a>
    </div>
  </div>

  <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
    <div class="p-4 border-b border-gray-50">
        <h2 class="text-lg font-bold text-gray-800">Liste des utilisateurs</h2>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full">
        <thead>
          <tr class="bg-gray-50/50 text-gray-500 text-sm uppercase">
            <th class="px-6 py-4 font-semibold text-left">Id</th>
            
            <th class="px-6 py-4 font-semibold text-left">Nom</th>
            <th class="px-6 py-4 font-semibold text-left">Email</th>
            <th class="px-6 py-4 font-semibold text-right">Actions</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-100">
          @for (item of UtilisateursFiltres() | paginate: { itemsPerPage: 4, currentPage: pageActuelle() }; track item.id) {
            <tr class="hover:bg-blue-50/30 transition-colors group">
              <td class="px-6 py-4 text-sm text-gray-400 font-mono">#{{ item.id }}</td>
              <td class="px-6 py-4 text-sm font-semibold text-blue-600">
                {{ item.nom }}
              </td>
                <td class="px-6 py-4 text-sm text-gray-500">
                    {{ item.email }}
                </td>   
              <td class="px-6 py-4 text-right">
                <div class="flex justify-end gap-3 opacity-0 group-hover:opacity-100 transition-opacity">
                    <a [routerLink]="['/modifier-produit', item.id]" class="p-2 text-blue-600 hover:bg-blue-100 rounded-lg transition" title="Modifier">
                        <i class="fa fa-edit"></i>
                    </a>
                    <button *ngIf="item.id !== undefined" (click)="supprimerUtilisateur(item.id!)" class="p-2 text-red-600 hover:bg-red-100 rounded-lg transition" title="Supprimer">
                       <i class="fa fa-trash"></i>
                    </button>
                </div>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="5" class="px-6 py-12 text-center">
                <div class="flex flex-col items-center">
                    <i class="fas fa-box-open text-4xl text-gray-200 mb-4"></i>
                    <p class="text-gray-500 italic">Aucun produit trouvé dans votre inventaire.</p>
                </div>
              </td>
            </tr>
          }
        </tbody>
      </table>

       <!-- Pagination stylisée -->
    <div class="p-4 border-t border-gray-50 flex justify-center custom-pagination">
      <pagination-controls 
        (pageChange)="pageActuelle.set($event)"
        previousLabel="Précédent"
        nextLabel="Suivant">
      </pagination-controls>
    </div>
    </div>
  </div>
</div>
