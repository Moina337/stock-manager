<div class="flex h-screen">
  <!-- Sidebar -->
  <aside class="w-64 bg-slate-900 text-white flex flex-col shadow-xl">
    <div class="p-6 text-2xl font-bold border-b border-slate-800 flex items-center">
      <i class="fa fa-shopping-cart text-blue-400 mr-3"></i> AdminStock
    </div>
    
    <nav class="flex-1 p-4 space-y-2">
     

      <!-- Produits -->
      <a routerLink="/produits" 
         routerLinkActive="bg-blue-600 text-white shadow-lg"
         class="flex items-center p-3 text-slate-300 hover:bg-slate-800 hover:text-white rounded-lg transition">
        <i class="fa fa-archive w-6"></i> Produits
      </a>

      <!-- Catégories -->
      <a routerLink="/categories" 
         routerLinkActive="bg-blue-600 text-white shadow-lg"
         class="flex items-center p-3 text-slate-300 hover:bg-slate-800 hover:text-white rounded-lg transition">
        <i class="fa fa-tags w-6"></i> Catégories
      </a>

       <!-- Utilisateurs -->
      <a routerLink="/utilisateurs" 
         routerLinkActive="bg-blue-600 text-white shadow-lg"
         class="flex items-center p-3 text-slate-300 hover:bg-slate-800 hover:text-white rounded-lg transition">
        <i class="fa fa-users w-6"></i> Utilisateurs
      </a>
    </nav>

    <!-- Logout -->
    <div class="p-4 border-t border-slate-800">
     <button (click)="deconnecter()" 
        class="w-full flex items-center p-3 text-red-400 hover:bg-red-500 hover:text-white rounded-lg transition duration-300">
  <i class="fa fa-sign-out w-6"></i> 
  <span class="font-semibold">Déconnexion</span>
</button>

    </div>
  </aside>

  <!-- Main content -->
  <div class="flex-1 flex flex-col overflow-hidden bg-gray-50">
    <header class="h-16 bg-white shadow-sm border-b flex items-center justify-between px-8">
      <div class="text-gray-500 font-medium">
        Gestion / <span class="text-gray-800 font-bold">{{titrePage()}}</span>
      </div>
      <div class="text-right">

</div>

    </header>

    <main class="flex-1 overflow-y-auto p-8">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
