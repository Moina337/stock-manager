<div class="max-w-4xl mx-auto  px-4">
  <!-- En-tête -->
  <div class="mb-8 flex items-center justify-between">
    <div>
      <h2 class="text-3xl font-extrabold text-gray-900 tracking-tight">Modifier le produit</h2>
      <p class="text-gray-500 mt-1">
        Mise à jour des informations du produit
        <span class="font-mono text-indigo-600 font-bold"></span>
      </p>
    </div>
   
  </div>

  <!-- Formulaire Carte -->
  <form
    (submit)="validerModification()"
    class="bg-white rounded-3xl shadow-2xl border border-gray-100 overflow-hidden"
  >
    <div class="p-8 flex flex-col md:flex-row gap-8">
      <!-- SECTION GAUCHE : GESTION DE L'IMAGE -->
      <div class="flex-shrink-0 w-full md:w-1/3">
        <label class="text-sm font-bold text-gray-700 ml-1 mb-4 block">Visuel du produit</label>

        <!-- Image Unique -->
        <div class="space-y-4">
          <div
            class="relative aspect-square rounded-3xl overflow-hidden border-4 border-white shadow-lg bg-gray-100 flex items-center justify-center"
          >
            <!-- Afficher l'aperçu de la nouvelle image si sélectionnée -->
            @if (imagePreview) {
              <img
                [src]="imagePreview"
                class="w-full h-full object-cover"
                alt="Aperçu nouvelle image"
              />
            } @else if (produit?.image) {
              <!-- Sinon afficher l'image existante -->
              <img
                [src]="'http://localhost:8080/upload/produits/' + produit?.image"
                class="w-full h-full object-cover"
                alt="{{ produit?.nom }}"
              />
            } @else {
              <!-- Sinon afficher le placeholder -->
              <div class="text-center p-4">
                <i class="fa fa-picture-o text-4xl text-gray-200"></i>
                <p class="text-[10px] text-gray-400 mt-2 italic">Aucun visuel</p>
              </div>
            }
          </div>

          <!-- Upload nouvelle image -->
          <label
            for="imageUpload"
            class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed border-indigo-100 rounded-3xl cursor-pointer bg-indigo-50/30 hover:bg-indigo-50 hover:border-indigo-300 transition-all group"
          >
            <div class="flex flex-col items-center justify-center pt-3 pb-3 text-center px-4">
              <i
                class="fa fa-cloud-upload text-2xl text-indigo-200 group-hover:text-indigo-500 transition-colors mb-1"
              ></i>
              <p class="text-xs text-gray-500 font-medium">Changer l'image</p>
              <p class="text-[10px] text-gray-400 mt-0.5">JPG, PNG, WEBP</p>
            </div>
            <input
              id="imageUpload"
              type="file"
              class="hidden"
              (change)="onFileSelected($event)"
              accept="image/*"
            />
          </label>

          <!-- Message "Nouvelle image sélectionnée" -->
          @if (imagePreview) {
            <div
              class="flex items-center gap-2 p-2 bg-emerald-50 rounded-lg border border-emerald-100 text-xs"
            >
              <div class="flex-1">
                <p class="font-bold text-emerald-800">Image prête !</p>
              </div>
              <button
                type="button"
                (click)="supprimerImageSelectionnee()"
                class="w-6 h-6 flex items-center justify-center bg-white text-red-500 rounded-full hover:bg-red-50 transition-colors"
              >
                <i class="fa fa-trash text-xs"></i>
              </button>
            </div>
          }
        </div>
      </div>

      <!-- SECTION DROITE : INFORMATIONS TEXTUELLES -->
      <div class="flex-1 space-y-8">
        <!-- Nom -->
        <div class="space-y-2">
          <label for="nom" class="text-sm font-bold text-gray-700 ml-1">Nom du produit</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-400">
              <i class="fa fa-pencil text-sm"></i>
            </span>
            <input
              type="text"
              id="nom"
              name="nom"
              [(ngModel)]="produitUpdate.nom"
              required
              class="block w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all"
            />
          </div>
        </div>

        <!-- Prix -->
        <div class="space-y-2">
          <label for="prix" class="text-sm font-bold text-gray-700 ml-1">Prix de vente</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-400">
              <i class="fa fa-eur text-sm"></i>
            </span>
            <input
              type="number"
              id="prix"
              name="prix"
              [(ngModel)]="produitUpdate.prix"
              required
              class="block w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all"
            />
          </div>
        </div>

        <!-- Catégorie -->
        <div class="space-y-2">
          <label for="categorie" class="text-sm font-bold text-gray-700 ml-1">Catégorie</label>
          <div class="relative">
            <select
              id="categorie"
              name="categorieId"
              [(ngModel)]="produitUpdate.categorieId"
              required
              class="block w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all appearance-none cursor-pointer"
            >
              <option [value]="undefined" disabled>Sélectionnez une catégorie</option>
              @for (cat of categories; track cat.id) {
                <option [value]="cat.id">{{ cat.nom }}</option>
              }
            </select>
            <div
              class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-400"
            >
              <i class="fa fa-chevron-down text-xs"></i>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- PIED DE CARTE : ACTIONS -->
    <div class="bg-gray-50 p-8 flex flex-col sm:flex-row gap-4">
      <button
        type="submit"
        class="flex-1 bg-indigo-600 text-white font-bold py-4 px-6 rounded-2xl hover:bg-indigo-700 shadow-xl shadow-indigo-200 transition-all hover:-translate-y-0.5 active:translate-y-0 flex items-center justify-center gap-3"
      >
        <i class="fa fa-save"></i>
        Enregistrer les modifications
      </button>

      <button
        type="button"
        routerLink="/produits"
        class="px-8 py-4 bg-white text-gray-500 font-bold rounded-2xl hover:bg-gray-100 transition-all border border-gray-200"
      >
        Annuler
      </button>
    </div>
  </form>
</div>
