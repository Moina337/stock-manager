<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4">
  <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-2xl shadow-xl">
    <div class="text-center">
      <h2 class="text-3xl font-extrabold text-gray-900">Connexion</h2>
      <p class="mt-2 text-gray-600 italic">Accédez à votre gestion de stock</p>
    </div>
    
    <form class="mt-8 space-y-6" (submit)="login()">
      <div class="rounded-md shadow-sm space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Email</label>
          <input name="email" type="email" [(ngModel)]="loginRequest.email" required 
                 class="appearance-none relative block w-full px-3 py-3 border border-gray-300 rounded-xl focus:ring-indigo-500 focus:border-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Mot de passe</label>
          <input name="password" type="password" [(ngModel)]="loginRequest.password" required 
                 class="appearance-none relative block w-full px-3 py-3 border border-gray-300 rounded-xl focus:ring-indigo-500 focus:border-indigo-500 outline-none">
        </div>
      </div>

      <button type="submit" class="group relative w-full flex justify-center py-3 px-4 border border-transparent font-bold rounded-xl text-white bg-indigo-600 hover:bg-indigo-700 transition shadow-lg shadow-indigo-100">
        Se connecter
      </button>
    </form>
  </div>
</div>
